{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="wrap">
    <h1>{{ t("nav_blog") }}</h1>
    {% if posts %}
    <div class="post-cards">
      {% for p in posts %}
      <article class="post-card">
        <h3><a href="/{{ lang }}/blog/{{ p.slug }}">{{ p.title }}</a></h3>
        {% if p.published_at %}
        <div class="meta">{{ p.published_at.strftime("%b %d, %Y") }}</div>
        {% endif %}
        <p class="excerpt">{{ p.excerpt }}</p>
        <a class="read-more" href="/{{ lang }}/blog/{{ p.slug }}">{{ t("read_more") }} &rarr;</a>
      </article>
      {% endfor %}
    </div>
    {% endif %}
  </div>
</section>
{% endblock %}
