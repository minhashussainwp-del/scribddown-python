{% extends "admin/base.html" %}
{% block admin_content %}
<h1>{% if post %}Edit Post{% else %}New Post{% endif %}</h1>
<p class="admin-sub">{% if post %}ID {{ post.id }}{% else %}Write a new blog post.{% endif %}</p>

<form method="post" class="form-card">
  <label for="f-title">Title</label>
  <input type="text" id="f-title" name="title" required maxlength="255"
         value="{{ post.title if post else '' }}">

  <label for="f-slug">Slug</label>
  <input type="text" id="f-slug" name="slug" maxlength="255"
         value="{{ post.slug if post else '' }}">
  <div class="form-hint">Leave blank to auto-generate from the title.</div>

  <label for="f-excerpt">Excerpt</label>
  <textarea id="f-excerpt" name="excerpt">{{ post.excerpt if post else '' }}</textarea>

  <label for="f-content">Content</label>
  <textarea id="f-content" name="content" class="tall">{{ post.content if post else '' }}</textarea>
  <div class="form-hint">HTML + shortcodes allowed.</div>

  <div class="form-row">
    <div>
      <label for="f-category">Category</label>
      <select id="f-category" name="category_id">
        <option value="">— None —</option>
        {% for c in categories %}
        <option value="{{ c.id }}"{% if post and post.category_id == c.id %} selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="f-tags">Tags</label>
      <input type="text" id="f-tags" name="tags" value="{{ tag_str if tag_str is defined else '' }}">
      <div class="form-hint">Comma separated.</div>
    </div>
  </div>

  <label for="f-image">Featured image URL</label>
  <input type="url" id="f-image" name="featured_image" maxlength="512"
         value="{{ post.featured_image if post else '' }}">

  <div class="form-row">
    <div>
      <label for="f-lang">Language</label>
      <select id="f-lang" name="lang">
        {% for code in ["en", "ur", "hi", "es", "fr", "de"] %}
        <option value="{{ code }}"{% if post and post.lang == code %} selected{% endif %}>{{ code }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field-checkbox">
      <input type="checkbox" id="f-published" name="published" value="1"{% if post and post.published %} checked{% endif %}>
      <label for="f-published">Published</label>
    </div>
  </div>

  <label for="f-meta-title">Meta title</label>
  <input type="text" id="f-meta-title" name="meta_title" maxlength="255"
         value="{{ post.meta_title if post else '' }}">

  <label for="f-meta-desc">Meta description</label>
  <textarea id="f-meta-desc" name="meta_description">{{ post.meta_description if post else '' }}</textarea>

  <div class="form-actions">
    <button type="submit" class="btn">Save Post</button>
    <a class="btn btn-ghost" href="/admin/posts">Cancel</a>
  </div>
</form>
{% endblock %}
